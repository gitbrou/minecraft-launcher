<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mine Launcher</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="grass" aria-hidden="true"><i></i><i></i><i></i></span>
    <div>
      <h1>Mine Launcher</h1>
      <span class="ver" id="ver"></span>
    </div>
  </div>
  <button class="ghost" id="openNative" type="button">Нативный режим</button>
</header>

<main class="layout">
  <section class="panel profile">
    <span class="label">Профиль</span>
    <div class="who">
      <div class="avatar" id="avatar">?</div>
      <div>
        <strong id="nick">Нет аккаунта</strong>
        <span class="sub" id="nickSub">Добавь в нативном режиме</span>
      </div>
    </div>

    <button class="play" id="play" type="button" disabled>
      <span class="play-icon" aria-hidden="true"></span>
      <span>Играть</span>
    </button>

    <div class="row">
      <button class="ghost" id="refresh" type="button">Обновить</button>
      <button class="ghost" id="versions" type="button">Версии</button>
    </div>
  </section>

  <section class="panel list">
    <div class="list-head">
      <span class="label">Версии</span>
      <span class="count" id="count"></span>
    </div>
    <div id="versionsList" class="cards"></div>
    <div id="empty" class="empty" hidden>
      <p>Версий пока нет.</p>
      <button class="ghost" id="install" type="button">Установить версию</button>
    </div>
  </section>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="spinner" aria-hidden="true"></div>
  <p id="overlayText">Запускаем игру</p>
</div>

<script src="app.js"></script>
</body>
</html>
