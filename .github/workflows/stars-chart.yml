name: Generate Stars Chart

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Star History Chart
        uses: gregberge/github-activity-stream@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: assets/stars.svg

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update stars chart SVG"
          file_pattern: assets/stars.svg
