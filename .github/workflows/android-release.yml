name: Android release

# Только Android: собирает APK и заливает их в уже существующий релиз.
# Смоук и сборка идут параллельно, но публикация начнётся только если оба зелёные.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза, куда залить APK (например v2.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  smoke:
    uses: ./.github/workflows/android-smoke.yml

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [all, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            android/PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('android/PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-
      - name: Install cargo-ndk
        run: |
          mkdir -p ~/.cargo/bin
          curl -sL 'https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz' \
            | tar xz -C ~/.cargo/bin --strip-components 1
          chmod +x ~/.cargo/bin/cargo-ndk*
      - name: Set up Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install 'ndk;27.0.12077973' >/dev/null
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build web UI
        run: |
          npm ci
          npm run build:web
          rm -rf android/ZalithLauncher/src/main/assets/mineui
          mkdir -p android/ZalithLauncher/src/main/assets/mineui
          cp -r dist-web/. android/ZalithLauncher/src/main/assets/mineui/
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=${{ matrix.arch }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: android/ZalithLauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish:
    needs: [smoke, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          pattern: apk-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: apks/*.apk
          fail_on_unmatched_files: true
