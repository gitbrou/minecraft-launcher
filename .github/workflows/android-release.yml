name: Android release

# Только Android: собирает APK и заливает их в уже существующий релиз.
# Нужен, когда менялся только android/ или веб-интерфейс, чтобы не
# пересобирать Windows, macOS и Linux.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза, куда залить APK (например v2.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [all, arm, arm64, x86, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: |
          mkdir -p ~/.cargo/bin
          curl -sL 'https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz' \
            | tar xz -C ~/.cargo/bin --strip-components 1
          chmod +x ~/.cargo/bin/cargo-ndk*
      - name: Set up Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install 'ndk;27.0.12077973' >/dev/null
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Build web UI
        run: |
          npm ci
          npm run build:web
          rm -rf android/ZalithLauncher/src/main/assets/mineui
          mkdir -p android/ZalithLauncher/src/main/assets/mineui
          cp -r dist-web/. android/ZalithLauncher/src/main/assets/mineui/
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=${{ matrix.arch }} --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: android/ZalithLauncher/build/outputs/apk/release/*.apk
