name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mine-launcher/package-lock.json
      - name: Install deps
        run: npm install
        working-directory: mine-launcher
      - name: Build Windows
        run: npm run build -- --win
        working-directory: mine-launcher
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mine-launcher-win
          path: mine-launcher/dist-build/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mine-launcher/package-lock.json
      - name: Install deps
        run: npm install
        working-directory: mine-launcher
      - name: Build Linux
        run: npm run build -- --linux AppImage
        working-directory: mine-launcher
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mine-launcher-linux
          path: mine-launcher/dist-build/*.AppImage

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mine-launcher/package-lock.json
      - name: Install deps
        run: npm install
        working-directory: mine-launcher
      - name: Build macOS
        run: npm run build -- --mac
        working-directory: mine-launcher
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mine-launcher-mac
          path: mine-launcher/dist-build/*.dmg

  release:
    needs: [build-windows, build-linux, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: mine-launcher-win
          path: artifacts/win
      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: mine-launcher-linux
          path: artifacts/linux
      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: mine-launcher-mac
          path: artifacts/mac
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Mine Launcher ${{ github.ref_name }}"
          body: |
            ## 🚀 Mine Launcher ${{ github.ref_name }}

            Скачай и играй без лишних настроек!

            | Платформа | Файл |
            |-----------|------|
            | 🪟 Windows | `Mine Launcher Setup *.exe` (установщик) или `Mine Launcher *.exe` (portable) |
            | 🐧 Linux | `Mine Launcher *.AppImage` |
            | 🍎 macOS | `Mine Launcher *.dmg` |

            ### ✨ Особенности:
            - Minecraft 1.12.2 по умолчанию, поддержка всех версий
            - Fabric / Forge / Quilt
            - 3D просмотр и загрузка скинов
            - Поиск модов с Modrinth
            - Автозапуск в fullscreen
          files: |
            artifacts/win/*.exe
            artifacts/linux/*.AppImage
            artifacts/mac/*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
