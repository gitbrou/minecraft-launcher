name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-build/*.exe
            dist-build/*.exe.blockmap
            dist-build/latest.yml
          generate_release_notes: true

  macos:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-build/*.dmg
          generate_release_notes: true

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-build/*.AppImage
          generate_release_notes: true

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [all, arm, arm64, x86, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: |
          mkdir -p ~/.cargo/bin
          curl -sL 'https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz' \
            | tar xz -C ~/.cargo/bin --strip-components 1
          chmod +x ~/.cargo/bin/cargo-ndk*
          cargo ndk --version
      - name: Set up Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install 'ndk;27.0.12077973' >/dev/null
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Build web UI
        run: |
          npm ci
          npm run build:web
          rm -rf android/ZalithLauncher/src/main/assets/mineui
          mkdir -p android/ZalithLauncher/src/main/assets/mineui
          cp -r dist-web/. android/ZalithLauncher/src/main/assets/mineui/
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=${{ matrix.arch }} --no-daemon
      - name: Rename mapping (arch)
        if: hashFiles('android/ZalithLauncher/build/outputs/mapping/release/mapping.txt') != ''
        working-directory: android/ZalithLauncher/build/outputs/mapping/release
        run: cp mapping.txt mapping-${{ matrix.arch }}.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            android/ZalithLauncher/build/outputs/apk/release/*.apk
            android/ZalithLauncher/build/outputs/mapping/release/mapping-*.txt
          generate_release_notes: true
