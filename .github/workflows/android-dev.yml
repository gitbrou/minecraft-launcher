name: Android dev build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture
        required: true
        default: arm64
        type: choice
        options: [all, arm, arm64, x86, x86_64]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: |
          mkdir -p ~/.cargo/bin
          curl -sL 'https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz' \
            | tar xz -C ~/.cargo/bin --strip-components 1
          chmod +x ~/.cargo/bin/cargo-ndk*
      - name: Set up Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install 'ndk;27.0.12077973' >/dev/null
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=${{ inputs.arch }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.arch }}
          path: android/ZalithLauncher/build/outputs/apk/release/*.apk
