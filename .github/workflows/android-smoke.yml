name: Android smoke test

# Реальный прогон на эмуляторе: ставим APK, запускаем лаунчер, дергаем
# фоновую службу и смотрим, не упало ли приложение.
on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - 'android/**'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            android/PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('android/PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          mkdir -p ~/.cargo/bin
          curl -sL 'https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz' \
            | tar xz -C ~/.cargo/bin --strip-components 1
          chmod +x ~/.cargo/bin/cargo-ndk*

      - name: Set up Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install 'ndk;27.0.12077973' >/dev/null
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build web UI
        run: |
          npm ci
          npm run build:web
          rm -rf android/ZalithLauncher/src/main/assets/mineui
          mkdir -p android/ZalithLauncher/src/main/assets/mineui
          cp -r dist-web/. android/ZalithLauncher/src/main/assets/mineui/

      - name: Build x86_64 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=x86_64 --no-daemon

      - name: Locate APK
        run: |
          ls -la android/ZalithLauncher/build/outputs/apk/debug/ || true
          APK=$(find "$GITHUB_WORKSPACE/android" -name "*.apk" -type f | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "found: $APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -e
            echo "APK=$APK"
            adb install -r "$APK"
            adb shell am start -n com.movtery.zalithlauncher.v2.debug/com.movtery.zalithlauncher.ui.activities.SplashActivity
            sleep 45
            adb shell input keyevent 4 || true
            adb shell am start-foreground-service -n com.movtery.zalithlauncher.v2.debug/com.movtery.zalithlauncher.keepalive.TaskKeepAliveService || true
            adb shell am start-foreground-service -n com.movtery.zalithlauncher.v2.debug/com.movtery.zalithlauncher.game.launch.GameService || true
            adb shell am start-foreground-service -n com.movtery.zalithlauncher.v2.debug/com.movtery.zalithlauncher.game.download.jvm_server.JvmService || true
            sleep 10
            echo '--- crashes ---'
            adb logcat -d > /tmp/logcat.txt || true
            grep -q 'FATAL EXCEPTION' /tmp/logcat.txt && { grep -A 25 'FATAL EXCEPTION' /tmp/logcat.txt; echo 'FAIL: app crashed'; exit 1; } || true
            grep -q 'CannotPostForegroundServiceNotification' /tmp/logcat.txt && { echo 'FAIL: bad foreground notification'; exit 1; } || true

            echo '--- channels ---'
            adb shell dumpsys notification --noredact > /tmp/notif.txt || true
            grep -q 'jvm.service' /tmp/notif.txt || { echo 'FAIL: no jvm.service'; exit 1; }
            grep -q 'game.service' /tmp/notif.txt || { echo 'FAIL: no game.service'; exit 1; }
            grep -q 'task.service' /tmp/notif.txt || { echo 'FAIL: no task.service'; exit 1; }
            grep -q 'terracotta_vpn_channel' /tmp/notif.txt || { echo 'FAIL: no terracotta channel'; exit 1; }
            echo 'all channels ok'

            echo '--- app alive ---'
            adb shell dumpsys activity processes | grep com.movtery.zalithlauncher || true


